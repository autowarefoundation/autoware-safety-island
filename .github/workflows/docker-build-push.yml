name: Build-Push Devcontainer

on:
  push:
    branches: [ main ]
    paths:
      - '.devcontainer/**'
      - '.github/workflows/docker-build-push.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            platform: linux/amd64
            suffix: amd64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
            suffix: arm64
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta (per-architecture tags)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: |
            suffix=-${{ matrix.suffix }}
          tags: |
            type=sha
            type=ref,event=branch
            type=ref,event=pr
            type=raw,value=devcontainer-${{ github.sha }}
            type=raw,value=devcontainer,enable={{is_default_branch}}

      - name: Validate Arm FVP archive inputs
        if: matrix.suffix == 'amd64'
        shell: bash
        env:
          ARM_FVP_ARCHIVE_URL: ${{ secrets.ARM_FVP_ARCHIVE_URL }}
          ARM_FVP_ARCHIVE_SHA256: ${{ secrets.ARM_FVP_ARCHIVE_SHA256 }}
        run: |
          set -euo pipefail
          if [ -z "${ARM_FVP_ARCHIVE_URL}" ] || [ -z "${ARM_FVP_ARCHIVE_SHA256}" ]; then
            echo "Missing ARM_FVP_ARCHIVE_URL or ARM_FVP_ARCHIVE_SHA256 secret for amd64 devcontainer image." >&2
            exit 1
          fi

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./.devcontainer
          platforms: ${{ matrix.platform }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          secrets: |
            arm_fvp_archive_url=${{ secrets.ARM_FVP_ARCHIVE_URL }}
            arm_fvp_archive_sha256=${{ secrets.ARM_FVP_ARCHIVE_SHA256 }}
          cache-from: type=gha,scope=devcontainer-${{ matrix.suffix }}
          cache-to: type=gha,mode=max,scope=devcontainer-${{ matrix.suffix }}

  merge-manifests:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta (multi-arch manifest tags)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha
            type=ref,event=branch
            type=ref,event=pr
            type=raw,value=devcontainer-${{ github.sha }}
            type=raw,value=devcontainer,enable={{is_default_branch}}

      - name: Create multi-arch manifest lists
        run: |
          set -euo pipefail
          while IFS= read -r tag || [ -n "$tag" ]; do
            [ -z "$tag" ] && continue
            base="${tag%%:*}"
            ref="${tag#*:}"
            docker buildx imagetools create -t "$tag" \
              "${base}:${ref}-amd64" \
              "${base}:${ref}-arm64"
          done <<< "${{ steps.meta.outputs.tags }}"
