name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

jobs:
  verify-tag:
    name: Verify tag is on main
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check tag points to a commit on main
        shell: bash
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "Error: tag does not point to a commit reachable from main"
            exit 1
          fi

  build-zephyr:
    name: Zephyr Build (${{ matrix.name }})
    needs: verify-tag
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/autowarefoundation/autoware-safety-island:devcontainer
    strategy:
      matrix:
        include:
          - target: fvp_baser_aemv8r_smp
            name: FVP
            artifact: zephyr-fvp.elf
          - target: s32z270dc2_rtu0_r52@D
            name: S32Z
            artifact: zephyr-s32z.elf

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Trust workspace (container runs as root)
        shell: bash
        run: git config --global --add safe.directory '*'

      # Initialise only the public submodules. s32ct_config is a PRIVATE
      # submodule (NXP Confidential generated configs) that the repo-scoped CI
      # token cannot clone, and the Zephyr/FreeRTOS-POSIX builds do not need it.
      - name: Initialize build submodules (private s32ct_config excluded)
        shell: bash
        run: git submodule update --init --recursive cyclonedds zephyr freertos-kernel

      - name: Restore Zephyr workspace cache
        id: zephyr-cache
        uses: actions/cache@v4
        with:
          path: |
            .west
            zephyr
            actuation_module/zephyr_modules
          key: zephyr-workspace-${{ hashFiles('actuation_module/west.yml') }}
          restore-keys: zephyr-workspace-

      - name: Restore CycloneDDS host tools cache
        uses: actions/cache@v4
        with:
          path: build/cyclonedds_host
          key: zephyr-cdds-host-${{ hashFiles('.gitmodules') }}

      - name: Initialize Zephyr workspace
        shell: bash
        run: |
          set -euo pipefail
          pip3 install -q -r zephyr/scripts/requirements-base.txt
          pip3 install -q -r zephyr/scripts/requirements-build-test.txt
          if [ "${{ steps.zephyr-cache.outputs.cache-hit }}" != "true" ]; then
            [ -d .west ] || west init -l actuation_module
            west update
          fi
          west zephyr-export

      - name: Build (${{ matrix.name }} target)
        shell: bash
        run: ./build.sh -t "${{ matrix.target }}"

      - name: Collect artifact
        shell: bash
        run: cp build/actuation_module/zephyr/zephyr.elf "${{ matrix.artifact }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}
          retention-days: 1

  build-freertos:
    name: FreeRTOS POSIX Simulator Build
    needs: verify-tag
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/autowarefoundation/autoware-safety-island:devcontainer

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Trust workspace (container runs as root)
        shell: bash
        run: git config --global --add safe.directory '*'

      # Initialise only the public submodules. s32ct_config is a PRIVATE
      # submodule (NXP Confidential generated configs) that the repo-scoped CI
      # token cannot clone, and the Zephyr/FreeRTOS-POSIX builds do not need it.
      - name: Initialize build submodules (private s32ct_config excluded)
        shell: bash
        run: git submodule update --init --recursive cyclonedds zephyr freertos-kernel

      - name: Restore CycloneDDS build cache
        uses: actions/cache@v4
        with:
          path: |
            build-freertos/cdds_host_out
            build-freertos/cdds_target_out
          key: cdds-${{ hashFiles('.gitmodules') }}

      - name: Phase 1 — CycloneDDS host tools (idlc)
        shell: bash
        run: |
          set -euo pipefail
          [ -f build-freertos/cdds_host_out/bin/idlc ] && exit 0
          cmake cyclonedds -B build-freertos/cyclonedds_host \
            -DBUILD_IDLC=ON -DBUILD_SHARED_LIBS=ON \
            -DCMAKE_INSTALL_PREFIX="${GITHUB_WORKSPACE}/build-freertos/cdds_host_out" \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_DDSPERF=OFF -DENABLE_SECURITY=OFF \
            -DENABLE_SSL=OFF -DENABLE_SHM=OFF \
            -DBUILD_EXAMPLES=OFF -DBUILD_TESTING=OFF
          cmake --build build-freertos/cyclonedds_host --target install -j"$(nproc)"

      - name: Phase 2 — CycloneDDS target library (static)
        shell: bash
        run: |
          set -euo pipefail
          [ -f build-freertos/cdds_target_out/lib/libddsc.a ] && exit 0
          cmake cyclonedds -B build-freertos/cyclonedds_target \
            -DBUILD_SHARED_LIBS=OFF -DENABLE_SECURITY=OFF \
            -DENABLE_SSL=OFF -DENABLE_SHM=OFF -DENABLE_IPV6=OFF \
            -DBUILD_IDLC=OFF -DBUILD_DDSPERF=OFF \
            -DCMAKE_INSTALL_PREFIX="${GITHUB_WORKSPACE}/build-freertos/cdds_target_out" \
            -DCMAKE_BUILD_TYPE=Debug
          cmake --build build-freertos/cyclonedds_target --target install -j"$(nproc)"

      - name: Phase 3 — Full controller build + runtime smoke
        shell: bash
        run: |
          source .github/scripts/ci-helpers.sh
          export PATH="${GITHUB_WORKSPACE}/build-freertos/cdds_host_out/bin:${PATH}"
          export LD_LIBRARY_PATH="${GITHUB_WORKSPACE}/build-freertos/cdds_host_out/lib:${LD_LIBRARY_PATH:-}"

          cmake actuation_module/freertos -B build-freertos/app \
            -DCDDS_HOST_PREFIX="${GITHUB_WORKSPACE}/build-freertos/cdds_host_out" \
            -DCDDS_TARGET_PREFIX="${GITHUB_WORKSPACE}/build-freertos/cdds_target_out"
          cmake --build build-freertos/app -j"$(nproc)"

          run_with_timeout build-freertos/app/actuation_freertos \
            build-freertos/app/controller.log 20

          require_marker build-freertos/app/controller.log "FreeRTOS POSIX simulator starting..."
          require_marker build-freertos/app/controller.log "Starting Controller Node..."
          require_marker build-freertos/app/controller.log "Controller Node Started"
          require_marker build-freertos/app/controller.log "Actuation Safety Island is Live"
          echo "Controller smoke OK: all 4 markers observed"

      - name: Phase 4 — unit_test build + run
        shell: bash
        run: |
          source .github/scripts/ci-helpers.sh
          export PATH="${GITHUB_WORKSPACE}/build-freertos/cdds_host_out/bin:${PATH}"
          export LD_LIBRARY_PATH="${GITHUB_WORKSPACE}/build-freertos/cdds_host_out/lib:${LD_LIBRARY_PATH:-}"

          cmake actuation_module/freertos -B build-freertos/app-unit \
            -DCDDS_HOST_PREFIX="${GITHUB_WORKSPACE}/build-freertos/cdds_host_out" \
            -DCDDS_TARGET_PREFIX="${GITHUB_WORKSPACE}/build-freertos/cdds_target_out" \
            -DBUILD_TEST=1
          cmake --build build-freertos/app-unit -j"$(nproc)"

          run_with_timeout build-freertos/app-unit/actuation_freertos \
            build-freertos/app-unit/unit.log 30

          require_marker build-freertos/app-unit/unit.log "=== All Tests Passed ==="
          echo "unit_test OK"

      - name: Phase 5 — DDS pub/sub paired build + run
        shell: bash
        run: |
          source .github/scripts/ci-helpers.sh
          export PATH="${GITHUB_WORKSPACE}/build-freertos/cdds_host_out/bin:${PATH}"
          export LD_LIBRARY_PATH="${GITHUB_WORKSPACE}/build-freertos/cdds_host_out/lib:${LD_LIBRARY_PATH:-}"

          cmake actuation_module/freertos -B build-freertos/app-pub \
            -DCDDS_HOST_PREFIX="${GITHUB_WORKSPACE}/build-freertos/cdds_host_out" \
            -DCDDS_TARGET_PREFIX="${GITHUB_WORKSPACE}/build-freertos/cdds_target_out" \
            -DBUILD_TEST=2
          cmake --build build-freertos/app-pub -j"$(nproc)"

          cmake actuation_module/freertos -B build-freertos/app-sub \
            -DCDDS_HOST_PREFIX="${GITHUB_WORKSPACE}/build-freertos/cdds_host_out" \
            -DCDDS_TARGET_PREFIX="${GITHUB_WORKSPACE}/build-freertos/cdds_target_out" \
            -DBUILD_TEST=3
          cmake --build build-freertos/app-sub -j"$(nproc)"

          sub_log=build-freertos/app-sub/sub.log
          pub_log=build-freertos/app-pub/pub.log
          rm -f "$sub_log" "$pub_log"

          # Subscriber first so discovery is hot when the publisher boots
          build-freertos/app-sub/actuation_freertos >"$sub_log" 2>&1 &
          sub_pid=$!
          sleep 2

          # Publisher publishes /vehicle/status/steering_status every 2s.
          # --kill-after escalates to SIGKILL if the binary ignores SIGTERM.
          set +e
          timeout --kill-after=5s 15s \
            build-freertos/app-pub/actuation_freertos >"$pub_log" 2>&1
          pub_rc=$?
          set -e
          if ! is_success_or_timeout "$pub_rc"; then
            dump_log "$pub_log"
            dump_log "$sub_log"
            kill_with_timeout "$sub_pid"
            echo "Publisher exited unexpectedly: $pub_rc" >&2
            exit "$pub_rc"
          fi

          # Drain time for the subscriber to consume in-flight messages,
          # then bounded teardown (SIGTERM -> SIGKILL after grace period).
          sleep 2
          kill_with_timeout "$sub_pid"

          require_marker "$pub_log" "Starting DDS publisher"

          count=$(grep -c "STEERING REPORT" "$sub_log" || true)
          if [ "$count" -lt 2 ]; then
            dump_log "$pub_log"
            dump_log "$sub_log"
            echo "Subscriber observed $count STEERING REPORTs; need >= 2" >&2
            exit 1
          fi
          echo "DDS pair OK: subscriber observed $count STEERING REPORTs"

      - name: Phase 6 — FreeRTOS CAN output tests
        shell: bash
        run: |
          source .github/scripts/ci-helpers.sh
          export PATH="${GITHUB_WORKSPACE}/build-freertos/cdds_host_out/bin:${PATH}"
          export LD_LIBRARY_PATH="${GITHUB_WORKSPACE}/build-freertos/cdds_host_out/lib:${LD_LIBRARY_PATH:-}"

          cmake actuation_module/freertos -B build-freertos/app-can \
            -DCDDS_HOST_PREFIX="${GITHUB_WORKSPACE}/build-freertos/cdds_host_out" \
            -DCDDS_TARGET_PREFIX="${GITHUB_WORKSPACE}/build-freertos/cdds_target_out" \
            -DBUILD_TEST=4 \
            -DCONFIG_CONTROL_CMD_OUTPUT_MODE=DDS_AND_CAN
          cmake --build build-freertos/app-can -j"$(nproc)"

          run_with_timeout build-freertos/app-can/actuation_freertos \
            build-freertos/app-can/can.log 20
          require_marker build-freertos/app-can/can.log "CAN output tests passed"
          echo "CAN test OK"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: freertos-simulator
          path: build-freertos/app/actuation_freertos
          retention-days: 1

  publish:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: [build-zephyr, build-freertos]
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: release/

      - name: Generate checksums
        shell: bash
        run: |
          cd release
          sha256sum zephyr-fvp.elf zephyr-s32z.elf actuation_freertos > sha256sums.txt
          cat sha256sums.txt

      - name: Create GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            release/zephyr-fvp.elf \
            release/zephyr-s32z.elf \
            release/actuation_freertos \
            release/sha256sums.txt \
            --repo "${{ github.repository }}" \
            --title "Release ${{ github.ref_name }}" \
            --verify-tag \
            --generate-notes
