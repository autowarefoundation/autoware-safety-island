name: Build and Test

on:
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 2 * * *'  # Daily at 02:00 UTC
  workflow_dispatch:
    inputs:
      devcontainer_image:
        description: 'Container image to use for CI jobs'
        required: false
        type: string
        default: 'ghcr.io/autowarefoundation/autoware-safety-island:devcontainer'

jobs:
  build-zephyr:
    name: Zephyr FVP
    runs-on: ubuntu-latest
    container:
      image: ${{ inputs.devcontainer_image || 'ghcr.io/autowarefoundation/autoware-safety-island:devcontainer' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Trust workspace (container runs as root)
        shell: bash
        run: git config --global --add safe.directory '*'

      # Initialise only the public submodules. s32ct_config is a PRIVATE
      # submodule (NXP Confidential generated configs) that the repo-scoped CI
      # token cannot clone, and the Zephyr/FreeRTOS-POSIX builds do not need it.
      - name: Initialize build submodules (private s32ct_config excluded)
        shell: bash
        run: git submodule update --init --recursive cyclonedds zephyr freertos-kernel

      - name: Restore Zephyr workspace cache
        id: zephyr-cache
        uses: actions/cache@v4
        with:
          path: |
            .west
            zephyr
            actuation_module/zephyr_modules
          key: zephyr-workspace-${{ hashFiles('actuation_module/west.yml') }}
          restore-keys: zephyr-workspace-

      - name: Initialize Zephyr workspace
        shell: bash
        run: |
          set -euo pipefail
          pip3 install -q -r zephyr/scripts/requirements-base.txt
          pip3 install -q -r zephyr/scripts/requirements-build-test.txt
          if [ "${{ steps.zephyr-cache.outputs.cache-hit }}" != "true" ]; then
            [ -d .west ] || west init -l actuation_module
            west update
          fi
          west zephyr-export

      - name: Resolve FVP pin
        id: fvp
        shell: bash
        run: |
          set -euo pipefail
          sha="$(sed -n 's/^FVP_SHA256="\(.*\)"$/\1/p' .github/scripts/ci-helpers.sh | head -n 1)"
          if [ -z "${sha}" ]; then
            echo "Cannot resolve FVP_SHA256 from .github/scripts/ci-helpers.sh" >&2
            exit 1
          fi
          echo "sha=${sha}" >> "$GITHUB_OUTPUT"

      - name: Restore FVP cache
        uses: actions/cache@v4
        with:
          path: build/tools/fvp
          key: fvp-${{ steps.fvp.outputs.sha }}

      - name: Run Zephyr FVP validation
        shell: bash
        run: .github/scripts/run-zephyr-fvp-ci.sh

      - name: Upload Zephyr FVP logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zephyr-fvp-logs
          path: build/zephyr-fvp/logs
          if-no-files-found: ignore
          retention-days: 7

  build-freertos:
    name: FreeRTOS POSIX
    runs-on: ubuntu-latest
    container:
      image: ${{ inputs.devcontainer_image || 'ghcr.io/autowarefoundation/autoware-safety-island:devcontainer' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Trust workspace (container runs as root)
        shell: bash
        run: git config --global --add safe.directory '*'

      - name: Resolve CycloneDDS pin
        id: cdds
        shell: bash
        run: echo "sha=$(git rev-parse HEAD:cyclonedds)" >> "$GITHUB_OUTPUT"

      # Initialise only the public submodules. s32ct_config is a PRIVATE
      # submodule (NXP Confidential generated configs) that the repo-scoped CI
      # token cannot clone, and the Zephyr/FreeRTOS-POSIX builds do not need it.
      - name: Initialize build submodules (private s32ct_config excluded)
        shell: bash
        run: git submodule update --init --recursive cyclonedds zephyr freertos-kernel

      - name: Restore CycloneDDS build cache
        uses: actions/cache@v4
        with:
          path: |
            build/cyclonedds_host
            build/cyclonedds_target_out
          key: cdds-${{ steps.cdds.outputs.sha }}

      - name: Run FreeRTOS POSIX validation
        shell: bash
        run: .github/scripts/run-freertos-posix-ci.sh

  build-freertos-vcan:
    name: FreeRTOS POSIX vcan
    runs-on: ubuntu-latest

    steps:
      - name: Load vcan on the runner
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends "linux-modules-extra-$(uname -r)"
          sudo modprobe vcan
          if ! ip link show vcan0 >/dev/null 2>&1; then
            sudo ip link add vcan0 type vcan
          fi
          sudo ip link set up vcan0
          ip link show vcan0

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Resolve CycloneDDS pin
        id: cdds
        shell: bash
        run: echo "sha=$(git rev-parse HEAD:cyclonedds)" >> "$GITHUB_OUTPUT"

      - name: Initialize build submodules (private s32ct_config excluded)
        shell: bash
        run: git submodule update --init --recursive cyclonedds zephyr freertos-kernel

      - name: Restore CycloneDDS build cache
        uses: actions/cache@v4
        with:
          path: |
            build/cyclonedds_host
            build/cyclonedds_target_out
          key: cdds-${{ steps.cdds.outputs.sha }}

      - name: Run SocketCAN vcan roundtrip
        shell: bash
        env:
          DEVCONTAINER_IMAGE: ${{ inputs.devcontainer_image || 'ghcr.io/autowarefoundation/autoware-safety-island:devcontainer' }}
        run: |
          set +e
          docker run --rm \
            --entrypoint bash \
            --network=host \
            --cap-add=NET_ADMIN \
            -v "${GITHUB_WORKSPACE}:${GITHUB_WORKSPACE}" \
            -w "${GITHUB_WORKSPACE}" \
            -e GITHUB_WORKSPACE \
            -e GITHUB_ACTIONS \
            -e HOME=/tmp \
            "${DEVCONTAINER_IMAGE}" \
            -lc 'git config --global --add safe.directory "*" && .github/scripts/run-freertos-vcan-ci.sh'
          rc=$?
          set -e
          sudo chown -R "$(id -u):$(id -g)" "${GITHUB_WORKSPACE}/build" 2>/dev/null || true
          exit "${rc}"

  build-zephyr-fvp-tap:
    name: Zephyr FVP TAP
    runs-on: ubuntu-latest

    steps:
      # vcan must exist in the kernel the container shares; loading it inside
      # the job container is not possible, so prepare it on the runner host as
      # the FreeRTOS POSIX vcan job does and run the tunnel test with host
      # networking. CI fails rather than skipping if vcan cannot be created.
      - name: Load vcan on the runner
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends "linux-modules-extra-$(uname -r)"
          sudo modprobe vcan
          if ! ip link show vcan0 >/dev/null 2>&1; then
            sudo ip link add vcan0 type vcan
          fi
          sudo ip link set up vcan0
          ip link show vcan0

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Initialize build submodules (private s32ct_config excluded)
        shell: bash
        run: git submodule update --init --recursive cyclonedds zephyr freertos-kernel

      - name: Restore Zephyr workspace cache
        uses: actions/cache@v4
        with:
          path: |
            .west
            zephyr
            actuation_module/zephyr_modules
          key: zephyr-workspace-${{ hashFiles('actuation_module/west.yml') }}
          restore-keys: zephyr-workspace-

      - name: Resolve FVP pin
        id: fvp
        shell: bash
        run: |
          set -euo pipefail
          sha="$(sed -n 's/^FVP_SHA256="\(.*\)"$/\1/p' .github/scripts/ci-helpers.sh | head -n 1)"
          if [ -z "${sha}" ]; then
            echo "Cannot resolve FVP_SHA256 from .github/scripts/ci-helpers.sh" >&2
            exit 1
          fi
          echo "sha=${sha}" >> "$GITHUB_OUTPUT"

      - name: Restore FVP cache
        uses: actions/cache@v4
        with:
          path: build/tools/fvp
          key: fvp-${{ steps.fvp.outputs.sha }}

      - name: Run Zephyr FVP TAP tunnel
        shell: bash
        env:
          DEVCONTAINER_IMAGE: ${{ inputs.devcontainer_image || 'ghcr.io/autowarefoundation/autoware-safety-island:devcontainer' }}
        run: |
          set +e
          docker run --rm \
            --entrypoint bash \
            --network=host \
            --cap-add=NET_ADMIN \
            --device /dev/net/tun \
            -v "${GITHUB_WORKSPACE}:${GITHUB_WORKSPACE}" \
            -w "${GITHUB_WORKSPACE}" \
            -e GITHUB_WORKSPACE \
            -e GITHUB_ACTIONS \
            -e HOME=/tmp \
            "${DEVCONTAINER_IMAGE}" \
            -lc 'git config --global --add safe.directory "*" && .github/scripts/run-zephyr-fvp-tap-ci.sh'
          rc=$?
          set -e
          sudo chown -R "$(id -u):$(id -g)" "${GITHUB_WORKSPACE}/build" 2>/dev/null || true
          exit "${rc}"
