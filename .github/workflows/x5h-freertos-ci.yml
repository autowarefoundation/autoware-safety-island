name: FreeRTOS X5H CI

# Review finding: this target's own gates were not reachable from CI at all.
# build-ci.yml builds the Zephyr FVP and FreeRTOS POSIX targets only, so
# everything this PR adds -- the freertos-x5h cross-build, the frozen ELF
# contract (`check-elf-contract.sh`) and the Core1 slot budget
# (`check-image-budget.sh`) -- was verified only by hand on a developer
# machine. The design's completion criterion 1 explicitly requires "a
# freertos-x5h build target produces a Core1-slot-compatible ELF from public
# sources (public BSP + pinned public toolchain) in CI", which is exactly
# what this workflow does.
#
# `push:` on the feature branches in addition to `pull_request:` -- the
# freertos-x5h work is a stack of branches, and a PR-only trigger would leave
# this workflow having never run on the branches where the target is actually
# being developed. Both fire once a PR against main exists; `github.ref`
# differs between the two events (branch ref vs. `refs/pull/N/merge`) so the
# `concurrency:` group below cannot dedupe them. Accepted as a known,
# self-resolving tradeoff for the lifetime of the PR.
on:
  push:
    branches:
      - feat/freertos-x5h-target
      - feat/freertos-x5h-netif
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      devcontainer_image:
        description: 'Container image to use for the amd64 jobs'
        required: false
        type: string
        default: 'ghcr.io/autowarefoundation/autoware-safety-island:devcontainer'

concurrency:
  group: x5h-freertos-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-x5h:
    name: freertos-x5h firmware + checkers
    # ubuntu-latest, not a ubicloud-standard-* label: this workflow's `on:`
    # trigger includes `pull_request: branches: [main]`, so it runs against
    # the upstream repo once a PR from this branch targets main there -- and
    # ubicloud runner groups are a fork-only add-on, not something upstream's
    # runner fleet has. A ubicloud-standard-* label upstream has no matching
    # runner group at all, so the job would queue forever rather than fail
    # loudly. Every other workflow in this repo (build-ci.yml, release.yml,
    # docs.yml) uses ubuntu-latest/ubuntu-24.04-arm for the same reason.
    runs-on: ubuntu-latest
    container:
      image: ${{ inputs.devcontainer_image || 'ghcr.io/autowarefoundation/autoware-safety-island:devcontainer' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Trust workspace (container runs as root)
        shell: bash
        run: git config --global --add safe.directory '*'

      # Only the submodules this target needs, and `--recursive` because
      # rcar_bsp carries the FreeRTOS kernel as its own nested submodule at
      # FreeRTOS/Source (see README.md's Prerequisites). s32ct_config is a
      # PRIVATE submodule (NXP Confidential) the repo-scoped CI token cannot
      # clone and this target does not reference; zephyr and freertos-kernel
      # are not needed here either.
      - name: Initialize build submodules (public rcar_bsp + lwip + cyclonedds)
        shell: bash
        run: git submodule update --init --recursive cyclonedds actuation_module/freertos_x5h/rcar_bsp actuation_module/freertos_x5h/lwip

      - name: Restore CycloneDDS host tool cache
        uses: actions/cache@v4
        with:
          path: build/cyclonedds_host
          key: cdds-host-x5h-${{ hashFiles('.gitmodules') }}

      - name: Restore pinned arm-none-eabi toolchain cache
        uses: actions/cache@v4
        with:
          path: build/toolchain
          key: arm-gnu-toolchain-13.2.rel1-${{ hashFiles('actuation_module/freertos_x5h/scripts/fetch-toolchain.sh') }}

      # The one build a developer would actually run: public BSP + pinned
      # public toolchain, no vendor portal, no NDA-gated SDK path. Needs
      # network egress -- fetch-toolchain.sh downloads the pinned Arm GNU
      # 13.2.Rel1 toolchain from developer.arm.com (sha256-verified), and
      # ENABLE_OPENAMP=1 makes CMake fetch OpenAMP/libmetal from public
      # GitHub at configure time. build_freertos_x5h() already runs
      # check-elf-contract.sh and check-image-budget.sh internally, and
      # `set -e` at the top of build.sh means either of them failing aborts
      # this step non-zero.
      - name: Build freertos-x5h (public BSP + pinned public toolchain)
        shell: bash
        run: ./build.sh --platform freertos-x5h -d build/freertos-x5h

      # Re-run both gates as their own named steps, on top of the ones
      # build.sh already ran internally above. Redundant by design:
      # defense-in-depth, and named steps make a regression in either gate
      # show up as its own red X in the Checks tab instead of being buried
      # inside the build step's log.
      - name: Re-verify ELF contract - actuation_x5h.elf
        shell: bash
        run: ./actuation_module/freertos_x5h/scripts/check-elf-contract.sh build/freertos-x5h/actuation_x5h.elf

      - name: Re-verify image budget - actuation_x5h.elf
        shell: bash
        run: ./actuation_module/freertos_x5h/scripts/check-image-budget.sh build/freertos-x5h/actuation_x5h.elf

      - name: Upload freertos-x5h ELF artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: freertos-x5h-elfs
          path: build/freertos-x5h/actuation_x5h.elf
          if-no-files-found: ignore
          retention-days: 7

  host-unit-test:
    name: FreeRTOS POSIX host unit test (rpmsg_netif_core)
    # ubuntu-latest for the same reason as the cross-compile job above.
    # build-ci.yml's existing build-freertos job already does comparable
    # work (a POSIX-simulator build: one host-native CycloneDDS compile, one
    # small C/C++ link) on plain ubuntu-latest.
    runs-on: ubuntu-latest
    container:
      image: ${{ inputs.devcontainer_image || 'ghcr.io/autowarefoundation/autoware-safety-island:devcontainer' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Trust workspace (container runs as root)
        shell: bash
        run: git config --global --add safe.directory '*'

      - name: Initialize build submodules (cyclonedds + freertos-kernel)
        shell: bash
        run: git submodule update --init --recursive cyclonedds freertos-kernel

      - name: Restore CycloneDDS build cache
        uses: actions/cache@v4
        with:
          path: |
            build/cyclonedds_host
            build/cyclonedds_target_out
          key: cdds-posix-${{ hashFiles('.gitmodules') }}

      # actuation_module/freertos/CMakeLists.txt's BUILD_TEST=1 path builds
      # BOTH unit_test.cpp (actuation_freertos) and rpmsg_netif_core_test
      # from actuation_module/freertos_x5h/rpmsg_netif_core.c, and runs
      # rpmsg_netif_core_test as a POST_BUILD custom command in the same
      # `cmake --build` invocation. `set -e` in build.sh means a failing
      # POST_BUILD test command aborts this step non-zero before the build
      # can report success. This is the only gate on the framing core's
      # boundary arithmetic, which is why it belongs in CI next to the
      # cross-build rather than being run by hand.
      - name: Build and run rpmsg_netif_core host unit test
        shell: bash
        run: ./build.sh --platform freertos-posix --unit-test
