name: FreeRTOS X5H CI

# Task 8b: the design's completion criterion 1 requires "a freertos-x5h
# build target produces a Core1-slot-compatible ELF from public sources
# (public BSP + pinned public toolchain) in CI", but build-ci.yml never
# builds this target and only triggers on `pull_request: branches: [main]`.
# The freertos-x5h netif work lives on feat/freertos-x5h-target and
# feat/freertos-x5h-netif, which have no PR against main yet, so a
# PR-only trigger would leave this workflow never having run. `push:` on
# those two branches plus `workflow_dispatch:` make it fire now;
# `pull_request:` keeps it working once a PR against main exists.
#
# Review round 2 (Minor): once a PR against main exists from one of these
# branches, both `push` and `pull_request` fire on every push to it --
# `github.ref` differs between the two events (branch ref vs. `refs/pull/
# N/merge`), so the `concurrency:` group below does not dedupe them and this
# doubles CI cost for the lifetime of the PR. Accepted as a known,
# self-resolving tradeoff: it only applies while a PR is open against main,
# and dropping `push:` once that PR exists (rather than leaving both) would
# be the cleanup, not a change made preemptively here.
on:
  push:
    branches:
      - feat/freertos-x5h-target
      - feat/freertos-x5h-netif
      - feat/x5h-actuation-param-profiles
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      devcontainer_image:
        description: 'Container image to use for the amd64 jobs'
        required: false
        type: string
        default: 'ghcr.io/autowarefoundation/autoware-safety-island:devcontainer'

concurrency:
  group: x5h-freertos-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-x5h:
    name: freertos-x5h firmware + checkers
    # ubuntu-latest, not a ubicloud-standard-* label (review finding,
    # Important): this workflow's own `on:` trigger includes
    # `pull_request: branches: [main]`, so it runs against the upstream repo
    # once a PR from this branch targets main there -- and ubicloud runner
    # groups are a fork-only add-on (this repo's youtalk fork routes heavy
    # jobs to them; see the CI-routing commit history), not something
    # upstream's runner fleet has. A ubicloud-standard-* label upstream has
    # no matching runner group at all, so the job would queue forever, not
    # fail loudly. Every other workflow in this repo (build-ci.yml,
    # release.yml, docs.yml) already uses ubuntu-latest/ubuntu-24.04-arm for
    # exactly this reason; this workflow now matches that convention.
    runs-on: ubuntu-latest
    container:
      image: ${{ inputs.devcontainer_image || 'ghcr.io/autowarefoundation/autoware-safety-island:devcontainer' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Trust workspace (container runs as root)
        shell: bash
        run: git config --global --add safe.directory '*'

      # Host-runnable regression test for verify-x5h-dds.sh's field-
      # plausibility parser (dds-plausibility.awk). Needs no submodules or
      # build artifacts -- run first for fast feedback if this ever
      # regresses. See test-dds-plausibility.sh's header for what it covers.
      - name: Verify DDS field-plausibility parser (host regression test)
        shell: bash
        run: ./actuation_module/freertos_x5h/scripts/test-dds-plausibility.sh

      # Only the submodules the freertos-x5h target needs. s32ct_config is a
      # PRIVATE submodule (NXP Confidential) that the repo-scoped CI token
      # cannot clone and this target does not reference; zephyr and
      # freertos-kernel are not needed either.
      - name: Initialize build submodules (public rcar_bsp + lwip + cyclonedds)
        shell: bash
        run: git submodule update --init --recursive cyclonedds actuation_module/freertos_x5h/rcar_bsp actuation_module/freertos_x5h/lwip

      # Review round 2 (Important): the x5h cross-build's own CycloneDDS
      # target output lives at build/freertos-x5h/cdds_target_out (written by
      # build-cdds-target.sh, invoked from build_freertos_x5h() in build.sh)
      # and that script `rm -rf`s its build dir on every invocation unless
      # FREERTOS_X5H_CDDS_NO_CLEAN is set, which this job does not set --
      # caching that path here would not survive a restore anyway. The path
      # actually below (build/cyclonedds_target_out) is written only by
      # build_cyclonedds_target_posix(), which is never called from the
      # freertos-x5h build path, so it was dead weight: nothing in this job
      # ever populates or reads it. No cache is wired up for the x5h
      # cross-build's CycloneDDS output for now; revisit only alongside
      # setting FREERTOS_X5H_CDDS_NO_CLEAN, which is a separate, untested
      # behavior change this fix round intentionally does not make.
      - name: Restore CycloneDDS host tool cache
        uses: actions/cache@v4
        with:
          path: build/cyclonedds_host
          key: cdds-host-x5h-${{ hashFiles('.gitmodules') }}

      - name: Restore pinned arm-none-eabi toolchain cache
        uses: actions/cache@v4
        with:
          path: build/toolchain
          key: arm-gnu-toolchain-13.2.rel1-${{ hashFiles('actuation_module/freertos_x5h/scripts/fetch-toolchain.sh') }}

      # This is the one build a developer would actually run: public BSP +
      # pinned public toolchain, no vendor portal, no NDA-gated SDK path.
      # Needs network egress: fetch-toolchain.sh downloads the pinned Arm GNU
      # 13.2.Rel1 toolchain from developer.arm.com (sha256-verified), and
      # ENABLE_OPENAMP=1 makes CMake fetch OpenAMP/libmetal from public
      # GitHub at configure time. build_freertos_x5h() already runs
      # check-dds-config.sh, check-elf-contract.sh (x2), and
      # check-image-budget.sh (x2) internally and `set -e`/`set -u` at the
      # top of build.sh means any of them failing aborts this step non-zero.
      - name: Build freertos-x5h (public BSP + pinned public toolchain)
        shell: bash
        run: ./build.sh --platform freertos-x5h -d build/freertos-x5h

      # Re-run the same three checkers as their own named steps, on top of
      # the ones build.sh already ran internally above. Redundant with the
      # previous step by design: defense-in-depth, and named steps make a
      # regression in any one gate show up as its own red X in the Checks
      # tab instead of being buried inside the "Build freertos-x5h" step's
      # log. The rpmsg-eth service-name argument matches build.sh's own
      # invocation -- that argument is what confirms the RPMsg transport
      # endpoint's service string made it into .rodata; Task 8's report
      # documents this path used to be broken (SIGPIPE-under-pipefail false
      # failure) and is now fixed, and CI is where it stays fixed.
      - name: Re-verify DDS wire config
        shell: bash
        run: ./actuation_module/freertos_x5h/scripts/check-dds-config.sh

      - name: Re-verify ELF contract - actuation_x5h.elf
        shell: bash
        run: ./actuation_module/freertos_x5h/scripts/check-elf-contract.sh build/freertos-x5h/actuation_x5h.elf rpmsg-eth after

      - name: Re-verify ELF contract - netif_only_x5h.elf
        shell: bash
        run: ./actuation_module/freertos_x5h/scripts/check-elf-contract.sh build/freertos-x5h/netif_only_x5h.elf rpmsg-eth after

      - name: Re-verify image budget - actuation_x5h.elf
        shell: bash
        run: ./actuation_module/freertos_x5h/scripts/check-image-budget.sh build/freertos-x5h/actuation_x5h.elf

      - name: Re-verify image budget - netif_only_x5h.elf
        shell: bash
        run: ./actuation_module/freertos_x5h/scripts/check-image-budget.sh build/freertos-x5h/netif_only_x5h.elf

      # Task 24: the instrumented (diag) image Task 23 added
      # (X5H_DIAG_TASK_TABLE=ON, CONFIG_DDS_LOG_LEVEL=3). Built into its own
      # -d directory (build/freertos-x5h-diag) via build.sh's --cmake-define
      # pass-through so the default build above -- its directory, its steps,
      # its artifact -- is untouched. A board session is only ever authorised
      # to flash a CI-built image, and until now CI only produced the
      # default config, so the instrumented ELF was never obtainable this
      # way. build_freertos_x5h() runs check-dds-config.sh/
      # check-elf-contract.sh (x2)/check-image-budget.sh (x2) internally
      # here too, exactly as it does for the default build above.
      - name: Build freertos-x5h diagnostic (X5H_DIAG_TASK_TABLE=ON, CONFIG_DDS_LOG_LEVEL=3)
        shell: bash
        run: ./build.sh --platform freertos-x5h -d build/freertos-x5h-diag --cmake-define X5H_DIAG_TASK_TABLE=ON --cmake-define CONFIG_DDS_LOG_LEVEL=3

      # Same defense-in-depth re-verification the default build gets above,
      # against the diag build's own ELFs: this is the image a board session
      # actually flashes, so it needs the same gates as its own named steps.
      - name: Re-verify ELF contract - actuation_x5h.elf (diag)
        shell: bash
        run: ./actuation_module/freertos_x5h/scripts/check-elf-contract.sh build/freertos-x5h-diag/actuation_x5h.elf rpmsg-eth after

      - name: Re-verify ELF contract - netif_only_x5h.elf (diag)
        shell: bash
        run: ./actuation_module/freertos_x5h/scripts/check-elf-contract.sh build/freertos-x5h-diag/netif_only_x5h.elf rpmsg-eth after

      - name: Re-verify image budget - actuation_x5h.elf (diag)
        shell: bash
        run: ./actuation_module/freertos_x5h/scripts/check-image-budget.sh build/freertos-x5h-diag/actuation_x5h.elf

      - name: Re-verify image budget - netif_only_x5h.elf (diag)
        shell: bash
        run: ./actuation_module/freertos_x5h/scripts/check-image-budget.sh build/freertos-x5h-diag/netif_only_x5h.elf

      # A SEPARATE artifact name from freertos-x5h-elfs (Task 24 requirement):
      # an operator fetching a flash image must not be able to confuse the
      # instrumented build with the default one that ships.
      - name: Upload freertos-x5h diagnostic ELF artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: freertos-x5h-diag-elfs
          path: |
            build/freertos-x5h-diag/actuation_x5h.elf
            build/freertos-x5h-diag/netif_only_x5h.elf
          if-no-files-found: ignore
          retention-days: 7

      # MRM before/after demo: the untuned "before" parameter profile, built
      # into its own -d directory so the default build above is untouched. A
      # board session is only ever authorised to flash a CI-built image, and
      # the demo needs both profiles -- the default build IS the "after"
      # image (verified above), this one is the "before".
      - name: Build freertos-x5h before-profile (untuned actuation params)
        shell: bash
        run: ./build.sh --platform freertos-x5h -d build/freertos-x5h-before --param-profile before

      # actuation_x5h.elf only, unlike the default and diag blocks above:
      # build.sh still builds and internally checks netif_only_x5h.elf here
      # too, but only actuation_x5h.elf is the flashed demo baseline that
      # gets uploaded (below), so only it is re-verified as its own step.
      - name: Re-verify ELF contract - actuation_x5h.elf (before)
        shell: bash
        run: ./actuation_module/freertos_x5h/scripts/check-elf-contract.sh build/freertos-x5h-before/actuation_x5h.elf rpmsg-eth before

      - name: Re-verify image budget - actuation_x5h.elf (before)
        shell: bash
        run: ./actuation_module/freertos_x5h/scripts/check-image-budget.sh build/freertos-x5h-before/actuation_x5h.elf

      # A SEPARATE artifact name (same rule as freertos-x5h-diag-elfs): an
      # operator fetching a flash image must not be able to confuse the
      # untuned demo baseline with the tuned image that ships.
      - name: Upload freertos-x5h before-profile ELF artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: freertos-x5h-before-elfs
          path: build/freertos-x5h-before/actuation_x5h.elf
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload freertos-x5h ELF artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: freertos-x5h-elfs
          path: |
            build/freertos-x5h/actuation_x5h.elf
            build/freertos-x5h/netif_only_x5h.elf
          if-no-files-found: ignore
          retention-days: 7

  host-unit-test:
    name: FreeRTOS POSIX host unit test (rpmsg_netif_core)
    # ubuntu-latest (review finding, Important -- see the same fix's
    # rationale on the cross-compile job above): a ubicloud-standard-* label
    # has no matching runner group upstream, where this workflow's own
    # pull_request trigger also runs. build-ci.yml's existing
    # build-freertos job already does comparable work (a POSIX-simulator
    # build: one host-native CycloneDDS compile, one small C/C++ link) on
    # plain ubuntu-latest, so this job matches that established baseline.
    runs-on: ubuntu-latest
    container:
      image: ${{ inputs.devcontainer_image || 'ghcr.io/autowarefoundation/autoware-safety-island:devcontainer' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Trust workspace (container runs as root)
        shell: bash
        run: git config --global --add safe.directory '*'

      - name: Initialize build submodules (cyclonedds + freertos-kernel)
        shell: bash
        run: git submodule update --init --recursive cyclonedds freertos-kernel

      - name: Restore CycloneDDS build cache
        uses: actions/cache@v4
        with:
          path: |
            build/cyclonedds_host
            build/cyclonedds_target_out
          key: cdds-posix-${{ hashFiles('.gitmodules') }}

      # actuation_module/freertos/CMakeLists.txt's BUILD_TEST=1 path builds
      # BOTH unit_test.cpp (actuation_freertos) and, since Task 5,
      # rpmsg_netif_core_test from actuation_module/freertos_x5h's own
      # rpmsg_netif_core.c against actuation_module/test's test harness, and
      # runs rpmsg_netif_core_test as a POST_BUILD custom command in the same
      # `cmake --build` invocation. `set -e` in build.sh means a failing
      # POST_BUILD test command aborts this step non-zero before the build
      # can report success.
      - name: Build and run rpmsg_netif_core host unit test
        shell: bash
        run: ./build.sh --platform freertos-posix --unit-test

  edge-ecu-peer-arm64:
    name: arm64 edge_ecu_peer bundle (native)
    # ubuntu-24.04-arm, not ubicloud-standard-8-arm (review finding,
    # Important -- see the same fix's rationale on the cross-compile job
    # above): this job's entire reason to exist is running natively on
    # arm64, not a particular vCPU count, and ubicloud-standard-8-arm has no
    # matching runner group upstream, where this workflow's own
    # pull_request trigger also runs. docker-build-push.yml's own
    # matrix.runner already establishes ubuntu-24.04-arm as this repo's
    # GitHub-hosted native-arm64 convention; this job now matches it.
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Initialize cyclonedds submodule
        shell: bash
        run: git submodule update --init --recursive cyclonedds

      - name: Ensure podman is available and configure a compatible OCI runtime
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v podman >/dev/null 2>&1; then
            sudo apt-get update -y
            sudo apt-get install -y podman
          fi
          podman --version

          # This job's first run on a genuinely native (non-qemu) arm64
          # runner failed every `podman run` below with "Error: OCI runtime
          # error: crun: unknown version specified" (exit 126). Root cause,
          # confirmed against upstream reports (containers/podman#27272 and
          # multiple Red Hat KBs describing the identical message): Podman
          # 5.x writes an OCI runtime spec declaring ociVersion 1.2.1, which
          # crun only parses correctly from v1.14.3 onward -- an
          # older/mismatched crun on the runner's image rejects it with
          # exactly this message. Rather than guess at which package channel
          # is stale (apt's crun vs. however podman itself got onto the
          # image), switch podman's default low-level OCI runtime to runc --
          # a separate implementation unaffected by this crun-specific
          # parsing gap -- via a containers.conf drop-in. This needs no
          # change to build-edge-ecu-peer-arm64.sh's `podman run`
          # invocations: the drop-in applies to every podman invocation made
          # afterward in this job.
          if ! command -v runc >/dev/null 2>&1; then
            sudo apt-get update -y
            sudo apt-get install -y runc
          fi
          sudo mkdir -p /etc/containers/containers.conf.d
          printf '[engine]\nruntime = "runc"\n' | sudo tee /etc/containers/containers.conf.d/99-runc.conf >/dev/null
          runtime_name="$(podman info --format '{{.Host.OCIRuntime.Name}}')"
          echo "podman OCI runtime: ${runtime_name}"
          if [ "${runtime_name}" != "runc" ]; then
            echo "ERROR: expected podman to use the runc OCI runtime after the containers.conf.d override, got '${runtime_name}'." >&2
            exit 1
          fi

      # This is the first time this script has ever run on a genuinely
      # native arm64 host. Every prior verification (Task 8's own report)
      # ran under x86_64->aarch64 qemu-user emulation via `podman --arch
      # arm64`; on a native arm64 runner that same flag is a no-op (it
      # already matches the host), so this is real native execution, not
      # emulation-shaped-like-native. Needs network egress: podman pulls the
      # digest-pinned arm64v8/ubuntu and ubuntu base images from docker.io,
      # and the reused freertos_s32z2/edge_ecu_peer/CMakeLists.txt fetches
      # its own CycloneDDS dependencies the same way build.sh does elsewhere.
      - name: Build the arm64 edge_ecu_peer bundle natively
        shell: bash
        run: ./actuation_module/freertos_x5h/scripts/build-edge-ecu-peer-arm64.sh

      # build-edge-ecu-peer-arm64.sh already asserts both of these internally
      # (readelf -d ... | grep -q '$ORIGIN/lib', file ... | grep -q "ARM
      # aarch64") right after the patchelf fix-up step, so this step is
      # deliberately redundant: it is the concrete, named CI check for the
      # thing this job exists to verify -- that
      # CMAKE_BUILD_WITH_INSTALL_RPATH=ON / CMAKE_INSTALL_RPATH='$ORIGIN/lib'
      # actually produce a $ORIGIN/lib RUNPATH on genuine aarch64 output, not
      # just "reasoned correct" as the design doc puts it.
      - name: Assert native arm64 output and $ORIGIN/lib RUNPATH
        shell: bash
        run: |
          set -euo pipefail
          BIN_DIR=build/edge-ecu-peer-arm64/build/peer-build
          for bin in edge_ecu_pub edge_ecu_sub; do
            file "${BIN_DIR}/${bin}" | tee "/tmp/${bin}-file.txt"
            grep -q "ARM aarch64" "/tmp/${bin}-file.txt"
            # Review round 2 (Minor): tee moved to *after* the runpath filter
            # (was before) so this file actually contains only the RUNPATH
            # line its name implies, not the full `readelf -d` dump.
            readelf -d "${BIN_DIR}/${bin}" | grep -i runpath | tee "/tmp/${bin}-runpath.txt"
            grep -q '\$ORIGIN/lib' "/tmp/${bin}-runpath.txt"
          done

      # Review finding (Important 6): build-edge-ecu-peer-arm64.sh now
      # asserts this internally too (both right after the copy loop and
      # again as an independent post-check), so this step is deliberately
      # redundant in the same spirit as the RUNPATH step above -- a
      # concrete, named CI check for "every libddsc* NEEDED entry the
      # binaries actually reference landed in the shipped bundle's lib/",
      # not just "the build script's own internal assertion didn't fire".
      - name: Assert bundle lib/ contains every libddsc NEEDED entry
        shell: bash
        run: |
          set -euo pipefail
          BIN_DIR=build/edge-ecu-peer-arm64/build/peer-build
          BUNDLE_LIB=build/edge-ecu-peer-arm64/bundle/lib
          for bin in edge_ecu_pub edge_ecu_sub; do
            needed=$(readelf -d "${BIN_DIR}/${bin}" | awk -F'[][]' '/NEEDED/{print $2}')
            for lib in ${needed}; do
              case "${lib}" in
                libddsc*)
                  test -e "${BUNDLE_LIB}/${lib}" || {
                    echo "ERROR: ${bin} needs ${lib}, missing from ${BUNDLE_LIB}/" >&2
                    exit 1
                  }
                  ;;
              esac
            done
          done

      - name: Upload arm64 edge_ecu_peer bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: edge-ecu-peer-arm64
          path: build/edge-ecu-peer-arm64.tar.gz
          if-no-files-found: ignore
          retention-days: 7
