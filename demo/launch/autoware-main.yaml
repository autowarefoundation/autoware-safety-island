# TODO(autoware_launch PR "feat(autoware_launch): expose
# diagnostic_graph_aggregator_graph_path in planning_simulator"): delete this
# file, its mount in ../docker-compose.yaml and ../commands,
# .github/scripts/check-demo-diag-graph.py and
# .github/workflows/demo-diag-graph.yml once the demo image's
# planning_simulator.launch.xml declares diagnostic_graph_aggregator_graph_path.
# Then mount autoware-safety-island.yaml next to autoware-main.yaml and pass it
# as diagnostic_graph_aggregator_graph_path.
#
# Interim replacement for autoware_launch's
# config/system/diagnostics/autoware-main.yaml in the demo image
# (universe-humble-2.0.0, see ../docker-compose.yaml).
# planning_simulator.launch.xml hard-codes that file as the diagnostic graph, so
# the demo mounts this copy over it. The copy is the image's file verbatim plus
# the edits of autoware-safety-island.yaml; CI
# (.github/scripts/check-demo-diag-graph.py) checks both against the pinned
# image.
#
# ---- BEGIN verbatim copy: autoware-main.yaml from the demo image ----
files:
  - { path: $(dirname)/control.yaml }
  - { path: $(dirname)/localization.yaml }
  - { path: $(dirname)/map.yaml }
  - { path: $(dirname)/perception.yaml }
  - { path: $(dirname)/planning.yaml }
  - { path: $(dirname)/system.yaml }
  - { path: $(dirname)/vehicle.yaml }

units:
  - path: /autoware/modes/local
    type: and
    list:
      - { type: link, link: /autoware/vehicle }
      - { type: link, link: /autoware/system }
      - { type: link, link: /autoware/control/local }
      - { type: link, link: /adapi/mrm_request/delegate }

  - path: /autoware/modes/remote
    type: and
    list:
      - { type: link, link: /autoware/vehicle }
      - { type: link, link: /autoware/system }
      - { type: link, link: /autoware/control/remote }
      - { type: link, link: /adapi/mrm_request/delegate }

  - path: /autoware/modes/stop
    type: and
    list:
      - { type: link, link: /adapi/mrm_request/delegate }

  - path: /autoware/modes/autonomous
    type: and
    list:
      - { type: link, link: /autoware/map }
      - { type: link, link: /autoware/localization }
      - { type: link, link: /autoware/planning }
      - { type: link, link: /autoware/perception }
      - { type: link, link: /autoware/control }
      - { type: link, link: /autoware/vehicle }
      - { type: link, link: /autoware/system }
      - { type: link, link: /adapi/mrm_request/delegate }

  - path: /autoware/modes/pull_over
    type: and
    list:
      - { type: link, link: /autoware/map }
      - { type: link, link: /autoware/localization }
      - { type: link, link: /autoware/planning }
      - { type: link, link: /autoware/perception }
      - { type: link, link: /autoware/control }
      - { type: link, link: /autoware/vehicle }
      - { type: link, link: /autoware/system }

  - path: /autoware/modes/comfortable_stop
    type: and
    list:
      - { type: link, link: /autoware/map }
      - { type: link, link: /autoware/localization }
      - { type: link, link: /autoware/planning }
      - { type: link, link: /autoware/perception }
      - { type: link, link: /autoware/control }
      - { type: link, link: /autoware/vehicle }
      - { type: link, link: /autoware/system }

  - path: /autoware/modes/emergency_stop
    type: and
    list:
      - { type: link, link: /autoware/vehicle }
      - { type: link, link: /autoware/system }

  - path: /adapi/mrm_request/delegate
    type: diag
    node: /adapi/node/mrm_request
    name: delegate
# ---- END verbatim copy ----

# Safety Island addition, identical to the edits in autoware-safety-island.yaml.
edits:
  - { type: remove, path: /autoware/control/performance_monitoring/control_state }
