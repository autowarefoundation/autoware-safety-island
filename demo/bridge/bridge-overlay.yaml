# Demo-only additions to the released topic contract (bridge-config.yaml).
#
# The bridge entrypoint merges these topics into bridge-config.yaml before it
# starts domain_bridge; bridge-config.yaml itself stays a 1:1 contract.
#
# Temporary: the pinned Autoware image (universe-humble-20261029) predates
# the trajectory gate, so nothing in it publishes /control/trajectory and its
# follower reads /planning/trajectory. Forward that topic to the Safety
# Island's /control/trajectory on domain 2. Delete this entry (and the
# overlay mount in docker-compose.yaml) once the demo image publishes
# /control/trajectory; the contract's control/trajectory entry then carries it.
topics:
  planning/trajectory:
    type: autoware_planning_msgs/msg/Trajectory
    from_domain: 1
    to_domain: 2
    remap: control/trajectory
