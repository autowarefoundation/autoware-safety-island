# Legacy demo bridge: forwards the classic domain-1 inputs and the legacy
# control_cmd output only. The supervised interfaces
# (/control/safety_island/approved_request, /control/safety_island/reenable
# and the visionpilot_msgs candidate inputs) are not bridged here; the E2E rig
# wires them on domain 2 / with its own bridge configuration. See
# documentation/design/topics.rst.
#
# Every topic keeps its name on both domains (no remap). This file is
# published as a release asset and pinned as the Safety Island's topic
# contract; .github/scripts/check-bridge-contract.py enforces both.

# Name of the domain bridge, used for node naming and logging
name: safety_island_bridge
topics:
  control/trajectory_follower/control_cmd:
    type: autoware_control_msgs/msg/Control
    from_domain: 2
    to_domain: 1
    # bidirectional: True
  vehicle/status/steering_status:
    type: autoware_vehicle_msgs/msg/SteeringReport
    from_domain: 1
    to_domain: 2
  # Autoware's trajectory gate output, the trajectory the follower consumes.
  # Autoware without the gate has no /control/trajectory: bridge the topic its
  # follower reads with "remap: control/trajectory". That topic depends on the
  # release; see documentation/design/topics.rst.
  control/trajectory:
    type: autoware_planning_msgs/msg/Trajectory
    from_domain: 1
    to_domain: 2
  system/operation_mode/state:
    type: autoware_adapi_v1_msgs/msg/OperationModeState
    from_domain: 1
    to_domain: 2
    # The state is published only when it changes. Retain the last value on
    # both sides of the bridge for late-joining safety-island subscribers.
    qos:
      reliability: reliable
      durability: transient_local
      history: keep_last
      depth: 1
  localization/kinematic_state:
    type: nav_msgs/msg/Odometry
    from_domain: 1
    to_domain: 2
  localization/acceleration:
    type: geometry_msgs/msg/AccelWithCovarianceStamped
    from_domain: 1
    to_domain: 2
